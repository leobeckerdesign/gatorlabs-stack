name: Build Polotno

on:
  push:
    paths:
      - 'polotno/**'
      - '.github/workflows/build-polotno.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: polotno/Dockerfile
          push: true
          tags: |
            ghcr.io/leobeckerdesign/polotno-gatorlabs:latest
            ghcr.io/leobeckerdesign/polotno-gatorlabs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
